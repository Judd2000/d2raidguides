<div class="flex flex-col items-center">
  <div class="flex flex-col w-fit">
    <div class="relative flex flex-row justify-center items-center space-x-2">
    <mat-icon class="absolute left-0 scale-75" routerLink="/">arrow_back</mat-icon>
      <span class="text-lg font-bold italic pr-4">{{rd()?.name}}</span>
      <img src="{{rd()?.imgUrl}}" class="w-15" />
    </div>
    <app-encounter-list
      [encounters]="rd()?.encounters ?? []"
      [rdPath]="rd()?.path"
      [color]="rd()?.colorName"
      [isLarge]="true"
    />
  </div>
</div>
